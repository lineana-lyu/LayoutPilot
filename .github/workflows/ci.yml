name: Extension CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run domain regression tests
        run: npm test

      - name: Verify interaction architecture
        run: npm run verify:interaction

      - name: Check AI Gateway syntax
        run: node --check gateway/server.mjs

      - name: Build extension
        run: npm run build

      - name: Verify extension package boundary
        run: npm run verify:package

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: layoutpilot-eext
          path: build/dist/*.eext
          if-no-files-found: error
