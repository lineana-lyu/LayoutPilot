<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LayoutPilot · PCB 布局工作台</title>
  <style>
    :root{
      color-scheme:light;
      --bg:#f3f4f6;
      --panel:#ffffff;
      --panel-subtle:#f7f8fa;
      --panel-hover:#f3f6fb;
      --line:#d9dee5;
      --line-strong:#c8cfd8;
      --text:#252a30;
      --muted:#68717b;
      --subtle:#929aa4;
      --accent:#4f7fdc;
      --accent-soft:#edf3fd;
      --ok:#23825f;
      --warn:#a86b17;
      --danger:#c13f3f;
      --font:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;
      --mono:"Cascadia Mono","SFMono-Regular",Consolas,monospace;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:12px}
    button{font:inherit}
    #app{height:100%;display:grid;grid-template-rows:38px 48px 1fr 38px;overflow:hidden;background:var(--panel)}
    .topbar{display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}
    .brand{font-size:13px;font-weight:600;color:#1f2429}
    .module-name{font-size:11px;color:var(--muted)}
    .grow{flex:1}
    .icon-btn,.collapse-btn,.btn{border:0;background:#fff;color:var(--text);cursor:pointer;transition:background-color .14s ease,color .14s ease,border-color .14s ease,opacity .14s ease}
    .icon-btn:hover,.collapse-btn:hover,.btn:hover{background:#f3f5f8}
    .collapse-btn{height:28px;padding:0 10px;border:1px solid #a9bfe8;background:var(--accent-soft);color:#315fba;font-size:10px;font-weight:600}
    .icon-btn{width:28px;height:28px;border:1px solid var(--line);display:grid;place-items:center}
    .btn{height:28px;padding:0 10px;border:1px solid var(--line);font-size:11px;background:#fff}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{background:#426fca}
    .btn.danger{color:var(--danger)}
    .btn:disabled,.collapse-btn:disabled{opacity:.42;cursor:not-allowed}
    .btn.small{height:25px;padding:0 8px;font-size:10px}
    .statusbar{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:var(--panel)}
    .stage{position:relative;display:grid;grid-template-columns:22px 1fr;grid-template-rows:20px 16px;column-gap:5px;padding:6px 10px 4px;border-right:1px solid var(--line);min-width:0;transition:background-color .15s ease}
    .stage:last-child{border-right:0}
    .stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;transition:background-color .16s ease}
    .stage-index{grid-row:1/3;align-self:center;width:18px;height:18px;line-height:17px;text-align:center;border:1px solid #cfd5dc;color:#7f8892;font-size:9px}
    .stage-label{align-self:end;font-size:11px;font-weight:600;white-space:nowrap}
    .stage-meta{align-self:start;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stage.done .stage-index{border-color:#9fc7b9;color:var(--ok)}
    .stage.active{background:#fafcff}
    .stage.active::after{background:var(--accent)}
    .stage.active .stage-index{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .stage.blocked::after{background:var(--danger)}
    .stage.blocked .stage-index{border-color:#d6a6a6;color:var(--danger)}
    .content{min-height:0;display:grid;grid-template-columns:218px minmax(0,1fr) 318px;overflow:hidden;background:var(--panel)}
    .sidebar,.main,.plan-pane{min-height:0;background:var(--panel);overflow:hidden}
    .sidebar{display:grid;grid-template-rows:auto auto 1fr;border-right:1px solid var(--line)}
    .main{overflow:auto}
    .plan-pane{display:grid;grid-template-rows:auto 1fr;border-left:1px solid var(--line)}
    .section-head{display:flex;align-items:center;gap:8px;min-height:43px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel-subtle)}
    .section-title{font-size:11px;font-weight:600}
    .section-subtitle{font-size:9px;color:var(--muted);margin-top:2px}
    .count{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}
    .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
    .metric{padding:7px 8px;border-right:1px solid var(--line);background:#fff}
    .metric:last-child{border-right:0}
    .metric strong{display:block;font-size:15px;line-height:17px;font-weight:600;font-family:var(--mono)}
    .metric span{font-size:9px;color:var(--muted)}
    .task-list{overflow:auto;padding:2px 0}
    .task{position:relative;width:100%;min-height:44px;text-align:left;border:0;border-bottom:1px solid #edf0f3;background:#fff;padding:6px 8px 6px 11px;cursor:pointer;transition:background-color .13s ease}
    .task:hover{background:var(--panel-hover)}
    .task.active{background:var(--accent-soft)}
    .task.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
    .task-row{display:flex;align-items:center;gap:6px}
    .task-name{font-family:var(--mono);font-size:11px;font-weight:600}
    .task-state{margin-left:auto;font-size:9px;color:var(--warn)}
    .task-state.ok{color:var(--ok)}
    .task-rail{font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .detail{padding:0}
    .detail-head{display:flex;align-items:flex-start;gap:10px;min-height:58px;padding:10px 12px;border-bottom:1px solid var(--line)}
    .ref{font-family:var(--mono);font-size:18px;font-weight:600;line-height:22px}
    .detail-copy{flex:1;min-width:0}
    .detail-title{font-size:11px;font-weight:600}
    .detail-sub{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.45}
    .status-text{font-size:9px;color:var(--warn);white-space:nowrap}
    .status-text.ok{color:var(--ok)}
    .property-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
    .property{min-width:0;padding:7px 10px;border-right:1px solid var(--line)}
    .property:last-child{border-right:0}
    .property-label{font-size:9px;color:var(--muted)}
    .property-value{margin-top:2px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .block{padding:10px 12px}
    .block-heading{display:flex;align-items:center;min-height:26px;margin-bottom:6px}
    .block-title{font-size:11px;font-weight:600}
    .block-help{margin-left:8px;font-size:9px;color:var(--muted)}
    .note{font-size:9px;line-height:1.55;color:var(--muted);padding:6px 8px;border:1px solid #e3e7ec;background:var(--panel-subtle);margin-bottom:8px}
    .host-table{border:1px solid var(--line);background:#fff}
    .host-table-head,.host-row{display:grid;grid-template-columns:64px minmax(128px,1.1fr) minmax(152px,1.15fr) 78px minmax(150px,1.2fr) 152px;align-items:stretch}
    .host-table-head{height:28px;background:#f4f6f8;border-bottom:1px solid var(--line);color:#606a74;font-size:9px}
    .host-row{min-height:62px;border-bottom:1px solid #e7ebef;transition:background-color .13s ease}
    .host-row:last-child{border-bottom:0}
    .host-row:hover{background:#fafcff}
    .host-row.selected{background:#f3f7fd;box-shadow:inset 2px 0 0 var(--accent)}
    .host-cell{min-width:0;padding:6px 7px;border-right:1px solid #eef1f4;display:flex;flex-direction:column;justify-content:center}
    .host-cell:last-child{border-right:0}
    .host-table-head .host-cell{padding-top:5px;padding-bottom:5px;justify-content:center}
    .host-ref{font-family:var(--mono);font-size:11px;font-weight:600}
    .host-name{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .host-meta{font-size:8px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pad-evidence{font-family:var(--mono);font-size:9px;color:#315fba;line-height:1.45;word-break:break-word}
    .distance-value{font-family:var(--mono);font-size:10px;color:#34404b}
    .distance-unit{font-size:8px;color:var(--muted);margin-top:2px}
    .topology{font-size:8px;color:#59636d;line-height:1.45}
    .topology-line{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .host-actions{display:flex;gap:5px;align-items:center;justify-content:flex-start;flex-wrap:wrap}
    .inline-plan{display:none}
    .plan-scroll{overflow:auto}
    .plan-overview{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
    .plan-stat{padding:8px 10px;border-right:1px solid var(--line)}
    .plan-stat:last-child{border-right:0}
    .plan-stat strong{font-family:var(--mono);font-size:15px;font-weight:600;display:block}
    .plan-stat span{font-size:9px;color:var(--muted)}
    .constraint-area{padding:8px 10px}
    .constraint-summary{display:flex;gap:12px;margin-bottom:7px;font-size:9px;color:var(--muted)}
    .constraint-list{border:1px solid var(--line)}
    .constraint-row{padding:7px 8px;border-bottom:1px solid #e8ebef;background:#fff}
    .constraint-row:last-child{border-bottom:0}
    .constraint-title{font-family:var(--mono);font-size:10px;font-weight:600}
    .constraint-meta{font-size:8px;color:var(--muted);margin-top:3px;line-height:1.45}
    .constraint-state{color:var(--ok)}
    .blocked{padding:7px 8px;border-left:2px solid var(--warn);background:#fffaf1;color:#66512c;font-size:9px;line-height:1.55}
    .layout-review{height:100%;display:grid;grid-template-rows:auto auto minmax(260px,1fr) auto auto;background:#fff}
    .layout-review-head{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
    .layout-review-title{font-size:12px;font-weight:600}
    .layout-review-sub{margin-top:3px;font-size:9px;color:var(--muted);line-height:1.45}
    .layout-review-skipped{margin-top:6px;font-size:8px;color:#6c7782}
    .layout-review-skipped summary{font-size:8px;color:#a46b12}
    .layout-review-skipped>div{display:grid;gap:3px;margin-top:4px;padding:6px 8px;background:#fff8ea;border:1px solid #efd7a3}
    .layout-review-skipped span{line-height:1.4}
    .layout-review-skipped strong{font-family:var(--mono);color:#5d6670}
    .layout-review-unchanged{margin-top:6px;font-size:8px;color:#567064}
    .layout-review-unchanged summary{font-size:8px;color:#2f7d55}
    .layout-review-unchanged>div{display:grid;gap:3px;margin-top:4px;padding:6px 8px;background:#f3faf6;border:1px solid #c9e5d4}
    .layout-review-unchanged span{line-height:1.4}
    .layout-review-unchanged strong{font-family:var(--mono);color:#315f49}
    .layout-review-item-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
    .review-item-tab{height:28px;min-width:78px;display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:4px;padding:0 7px;border:1px solid #d3d8de;background:#fafbfc;color:#4d5863;font:9px var(--font);cursor:pointer}
    .review-item-tab:hover{border-color:#9fb8df;background:#f4f7fc}
    .review-item-tab.active{border-color:#6f98df;background:#edf3fd;color:#315fba;box-shadow:inset 0 -2px 0 #4f7fdc}
    .review-item-tab span{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#e4e8ed;font:8px var(--mono);color:#58636e}
    .review-item-tab.active span{background:#4f7fdc;color:#fff}
    .review-item-tab strong{font-family:var(--mono);font-size:9px}
    .review-item-tab small{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .layout-review-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
    .layout-review-toolbar{display:flex;align-items:center;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);background:#f7f8fa}
    .review-segment{display:flex;gap:0}
    .review-segment .btn{border-radius:0;margin-left:-1px}
    .review-segment .btn:first-child{margin-left:0}
    .review-segment .btn.active{background:var(--accent-soft);border-color:#9bb8ee;color:#315fba;position:relative;z-index:1}
    .layout-review-legend{margin-left:auto;display:flex;gap:12px;font-size:9px;color:var(--muted)}
    .layout-review-legend span{display:flex;align-items:center;gap:4px}
    .legend-chip{width:16px;height:8px;border:1px solid #9ea5ad;display:inline-block}
    .legend-chip.muted{background:#dfe3e7}
    .legend-chip.accent{background:#d88716;border-color:#d88716}
    .legend-chip.current-red{background:#d74444;border-color:#d74444}
    .legend-chip.target-green{background:#24a66a;border-color:#24a66a}
    .layout-review-canvas{min-height:260px;padding:10px 12px;background:#eef0f2;overflow:auto}
    .layout-diff-svg{display:block;width:100%;height:100%;min-height:240px;background:#eef0f2;border:1px solid #d2d7dc}
    .native-review-frame{position:relative;width:100%;height:100%;min-height:240px;overflow:hidden;background:#30343a;border:1px solid #c9cfd6}
    .native-review-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
    .native-review-image-marked{filter:none;opacity:1}
    .native-review-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .focused-review-hint{display:flex;align-items:baseline;gap:8px;min-width:0}
    .focused-review-hint strong{font-size:9px;font-weight:600;color:#37414a}
    .focused-review-hint span{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .focused-placement-review{height:100%;min-height:470px;display:grid;grid-template-rows:108px minmax(300px,1fr);gap:10px}
    .focused-overview-card,.focused-compare-pane{min-width:0;border:1px solid #cfd5db;background:#fff;overflow:hidden}
    .focused-overview-card{display:grid;grid-template-rows:34px minmax(0,1fr)}
    .focused-section-head,.focused-pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px;border-bottom:1px solid #e3e6e9;background:#fafbfc}
    .focused-section-head>div:first-child{display:flex;align-items:baseline;gap:7px}
    .focused-section-head strong,.focused-pane-head strong{font-size:9px;font-weight:600;color:#303941}
    .focused-section-head span,.focused-scale{font-size:8px;color:var(--muted)}
    .focused-overview-legend{display:flex;align-items:center;gap:9px;font-size:8px;color:var(--muted)}
    .focused-overview-legend span{display:flex;align-items:center;gap:4px}
    .focused-overview-image-wrap,.focused-pane-image-wrap{min-height:0;background:#20252b;display:grid;place-items:center;overflow:hidden}
    .focused-native-image{display:block;width:100%;height:100%;object-fit:contain;filter:none;opacity:1;user-select:none;pointer-events:none}
    .focused-overview-image-wrap{background:#f7f8fa}
    .review-nav-strip{width:100%;height:100%;min-height:0;display:grid;grid-template-columns:minmax(150px,1fr) minmax(110px,.65fr) minmax(150px,1fr);align-items:center;gap:12px;padding:8px 14px;background:#f7f8fa}
    .review-nav-node{height:52px;border:1px solid #cfd5db;background:#fff;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:2px;align-content:center;text-align:left;padding:9px 12px;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease}
    .review-nav-node:hover,.review-nav-node:focus-visible{outline:none;transform:translateY(-1px);box-shadow:0 2px 8px rgba(34,43,54,.12)}
    .review-nav-node.current:hover,.review-nav-node.current:focus-visible{border-color:#d74444}
    .review-nav-node.target:hover,.review-nav-node.target:focus-visible{border-color:#24a66a}
    .review-nav-kicker{grid-row:1/3;align-self:center;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.05em;padding:4px 6px;border-radius:2px}
    .review-nav-node.current .review-nav-kicker{background:#fbe9e9;color:#b93333;border:1px solid #e9b8b8}
    .review-nav-node.target .review-nav-kicker{background:#e8f6ef;color:#187f4d;border:1px solid #addbc4}
    .review-nav-node strong{font-family:var(--mono);font-size:12px;color:#2f3942;line-height:1}
    .review-nav-node small{font-size:8px;color:var(--muted);line-height:1.1}
    .review-nav-move{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:8px;text-align:center;color:var(--muted)}
    .review-nav-line{grid-column:1/-1;grid-row:1;height:1px;background:linear-gradient(90deg,#d74444 0%,#c5cbd1 48%,#24a66a 100%);position:relative}
    .review-nav-line::after{content:"";position:absolute;right:-1px;top:-3px;border-left:6px solid #24a66a;border-top:3px solid transparent;border-bottom:3px solid transparent}
    .review-nav-move strong{grid-column:2;grid-row:2;font-family:var(--mono);font-size:10px;color:#39434d}
    .review-nav-move span:last-child{grid-column:3;grid-row:2;font-size:8px;justify-self:start}
    .focused-pane-image-wrap.vector{background:#52051d}
    .focused-vector-svg{display:block;width:100%;height:100%;min-height:260px;background:#52051d}
    .focused-vector-overview{display:block;width:100%;height:100%;background:#52051d}
    .review-hotspot{cursor:pointer;outline:none}
    .review-hotspot .review-focus-halo{opacity:0;transition:opacity .12s ease}
    .review-hotspot:hover .review-focus-halo,
    .review-hotspot:focus .review-focus-halo,
    .review-hotspot:focus-visible .review-focus-halo{opacity:1}
    .review-hotspot:hover text,
    .review-hotspot:focus text{filter:drop-shadow(0 0 3px rgba(255,255,255,.28))}
    .review-hotspot.accent-current:hover,
    .review-hotspot.accent-current:focus{filter:drop-shadow(0 0 5px rgba(215,68,68,.45))}
    .review-hotspot.accent-target:hover,
    .review-hotspot.accent-target:focus{filter:drop-shadow(0 0 5px rgba(36,166,106,.5))}
    .review-hotspot.minimap-marker:hover,
    .review-hotspot.minimap-marker:focus{filter:brightness(1.18)}
    .focused-placement-review.local-detail .focused-compare-pane.current{box-shadow:inset 0 3px 0 #d74444}
    .focused-placement-review.local-detail .focused-compare-pane.proposed{box-shadow:inset 0 3px 0 #24a66a}
    .focused-compare-grid{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .focused-compare-pane{display:grid;grid-template-rows:42px minmax(240px,1fr) 28px}
    .focused-pane-head>div:first-child{display:flex;align-items:center;gap:7px;min-width:0}
    .focused-pane-head strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .focused-kicker{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:2px}
    .focused-kicker.current{background:#fbe9e9;color:#b93333;border:1px solid #e9b8b8}
    .focused-kicker.proposed{background:#e8f6ef;color:#187f4d;border:1px solid #addbc4}
    .focused-pane-caption{padding:6px 8px;border-top:1px solid #e3e6e9;background:#fafbfc;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .layout-review-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .review-metric{padding:7px 10px;border-right:1px solid var(--line)}
    .review-metric:last-child{border-right:0}
    .review-metric span{display:block;font-size:8px;color:var(--muted)}
    .review-metric strong{display:block;margin-top:2px;font-family:var(--mono);font-size:11px;font-weight:600}
    .layout-review-note{padding:7px 12px;font-size:8px;line-height:1.5;color:var(--muted);background:#fafbfc}
    details{margin-top:8px}
    summary{cursor:pointer;font-size:9px;color:var(--muted)}
    .diagnostics{font-family:var(--mono);font-size:8px;line-height:1.55;color:var(--muted);white-space:pre-wrap;margin-top:5px}
    .empty{height:100%;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--text);font-size:12px;font-weight:600;margin-bottom:5px}
    .footer{display:flex;align-items:center;gap:6px;padding:0 8px;border-top:1px solid var(--line);background:#f6f7f8}
    .footer-note{font-size:8px;color:var(--muted);margin-left:auto;max-width:420px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .loading{position:absolute;left:0;right:0;top:86px;height:2px;background:transparent;display:none;z-index:30;overflow:hidden}
    .loading.show{display:block}
    .loading::after{content:"";display:block;height:2px;width:28%;background:var(--accent);animation:progress 1.05s ease-in-out infinite}
    @keyframes progress{0%{transform:translateX(-110%)}100%{transform:translateX(470%)}}
    .toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:#30363d;color:#fff;padding:7px 10px;border-radius:2px;font-size:9px;opacity:0;pointer-events:none;transition:opacity .16s ease;z-index:50}
    .toast.show{opacity:1}
    @media(max-width:1200px){
      .content{grid-template-columns:200px minmax(0,1fr)}
      .plan-pane{display:none}
      .inline-plan{display:block;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
      .host-table-head,.host-row{grid-template-columns:60px minmax(120px,1fr) minmax(145px,1.1fr) 74px 142px}
      .host-topology{display:none}
    }
    @media(max-width:860px){
      .layout-review-head{flex-direction:column}
      .layout-review-actions{margin-left:0}
      .layout-review-toolbar{align-items:flex-start;flex-direction:column}
      .layout-review-legend{margin-left:0}
      .focused-placement-review{height:auto;grid-template-rows:120px auto}
      .review-nav-strip{grid-template-columns:1fr;gap:6px;padding:8px;min-height:0}
      .review-nav-move{grid-template-columns:1fr auto 1fr}
      .review-nav-node{height:54px}
      .focused-compare-grid{grid-template-columns:1fr}
      .focused-compare-pane{min-height:330px}
      .layout-review-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
      .review-metric:nth-child(2){border-right:0}
      .review-metric:nth-child(-n+2){border-bottom:1px solid var(--line)}
      #app{grid-template-rows:38px 78px 1fr 38px}
      .statusbar{grid-template-columns:repeat(2,1fr)}
      .content{grid-template-columns:178px minmax(0,1fr)}
      .module-name,.toolbar-label{display:none}
      .property-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .property:nth-child(2){border-right:0}
      .property:nth-child(-n+2){border-bottom:1px solid var(--line)}
      .host-table-head{display:none}
      .host-row{grid-template-columns:62px minmax(0,1fr) 138px;grid-template-areas:"ref device actions" "pad pad actions" "distance distance actions";min-height:82px}
      .host-ref-cell{grid-area:ref}
      .host-device-cell{grid-area:device}
      .host-pad-cell{grid-area:pad;border-top:1px solid #f0f2f4}
      .host-distance-cell{grid-area:distance;border-top:1px solid #f0f2f4}
      .host-actions-cell{grid-area:actions}
      .host-topology{display:none}
    }
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">LayoutPilot</div>
    <div class="module-name">PCB 布局工作台</div>
    <div class="grow"></div>
    <button class="collapse-btn" id="collapseWorkbenchBtn" title="收起工作台并保留一个明显的返回条">收起工作台</button>
    <button class="icon-btn" id="gatewayBtn" title="配置 AI Gateway" aria-label="配置 AI Gateway">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm8 3.4-.1-1.3-2.1-.8a7 7 0 0 0-.7-1.6l.9-2-1.9-1.9-2 .9a7 7 0 0 0-1.6-.7L11.7 2H9.1l-.8 2.1a7 7 0 0 0-1.6.7l-2-.9-1.9 1.9.9 2A7 7 0 0 0 3 9.4l-2.1.8v2.6l2.1.8a7 7 0 0 0 .7 1.6l-.9 2 1.9 1.9 2-.9a7 7 0 0 0 1.6.7l.8 2.1h2.6l.8-2.1a7 7 0 0 0 1.6-.7l2 .9 1.9-1.9-.9-2a7 7 0 0 0 .7-1.6l2.1-.8V12Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="refreshBtn" title="刷新工作台" aria-label="刷新工作台">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M19 7v4h-4M5 17v-4h4M18.2 10A7 7 0 0 0 6.6 6.6L5 8m.8 6A7 7 0 0 0 17.4 17.4L19 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="statusbar">
    <div class="stage" id="stageAnalyze">
      <div class="stage-index">语</div>
      <div class="stage-label">电路理解</div>
      <div class="stage-meta" id="stageAnalyzeMeta">等待分析</div>
    </div>
    <div class="stage" id="stageOwner">
      <div class="stage-index">属</div>
      <div class="stage-label">Owner 决策</div>
      <div class="stage-meta" id="stageOwnerMeta">等待证据</div>
    </div>
    <div class="stage" id="stageConstraint">
      <div class="stage-index">布</div>
      <div class="stage-label">布局建议</div>
      <div class="stage-meta" id="stageConstraintMeta">0 条约束</div>
    </div>
    <div class="stage" id="stageExecute">
      <div class="stage-index">执</div>
      <div class="stage-label">执行安全</div>
      <div class="stage-meta" id="stageExecuteMeta">尚未进入</div>
    </div>
  </div>

  <div class="content">
    <aside class="sidebar">
      <div class="section-head">
        <div>
          <div class="section-title">器件决策队列</div>
          <div class="section-subtitle">待确认优先 · 已确认保留追溯</div>
        </div>
        <div class="count" id="taskCount">—</div>
      </div>
      <div class="summary-grid">
        <div class="metric"><strong id="metricAnalyzed">—</strong><span>语义器件</span></div>
        <div class="metric"><strong id="metricPending">—</strong><span>待确认</span></div>
        <div class="metric"><strong id="metricConstraints">—</strong><span>约束</span></div>
      </div>
      <div class="task-list" id="taskList"></div>
    </aside>

    <main class="main" id="mainPanel">
      <div class="empty"><div><strong>正在读取当前 PCB</strong><span>加载确定性拓扑、语义快照和人工决策。</span></div></div>
    </main>

    <aside class="plan-pane">
      <div class="section-head">
        <div>
          <div class="section-title">布局约束</div>
          <div class="section-subtitle">确定性证据 + 人工确认</div>
        </div>
      </div>
      <div class="plan-scroll" id="planPanel"></div>
    </aside>
  </div>

  <div class="footer">
    <button class="btn primary" id="analyzeBtn">重新分析</button>
    <button class="btn" id="previewPlanBtn" disabled>生成布局预览</button>
    <button class="btn" id="applyBtn" disabled>物理预检并应用</button>
    <button class="btn danger" id="undoBtn" disabled>撤销上次布局</button>
    <div class="footer-note" id="footerNote">执行前检查走线、BBox、Keepout、板框、碰撞与 DRC。</div>
  </div>
</div>
<div class="loading" id="loading"></div>
<div class="toast" id="toast"></div>
<script src="/dist/workbench.js"></script>
</body>
</html>
