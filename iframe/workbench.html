<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LayoutPilot · PCB 布局工作台</title>
  <style>
    :root{
      color-scheme:light;
      --bg:#f3f5f7;--panel:#fff;--panel-2:#f7f9fb;--line:#dfe5ea;
      --text:#17212b;--muted:#64717d;--subtle:#8d98a2;--accent:#176fbd;
      --accent-soft:#edf5fb;--ok:#177a61;--ok-soft:#eaf7f2;--warn:#a76500;
      --warn-soft:#fff5df;--danger:#b43b3b;--danger-soft:#fff1f1;
      --shadow:0 8px 28px rgba(20,34,48,.10);--radius:10px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    button{font:inherit}
    #app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}
    .topbar{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
    .brand{font-size:15px;font-weight:800;letter-spacing:.1px}
    .tag{font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel-2)}
    .grow{flex:1}
    .icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;cursor:pointer}
    .icon-btn{width:30px;height:30px;display:grid;place-items:center}
    .btn{padding:7px 10px;font-weight:650}
    .btn:hover,.icon-btn:hover{border-color:#b8c5cf;background:#fafcfd}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{background:#105e9f}
    .btn.danger{color:var(--danger)}
    .btn:disabled{opacity:.42;cursor:not-allowed}
    .statusbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-bottom:1px solid var(--line)}
    .stage{position:relative;padding:9px 11px;border-right:1px solid var(--line);min-width:0}
    .stage:last-child{border-right:0}
    .stage-kicker{font-size:9px;color:var(--subtle);text-transform:uppercase;letter-spacing:.45px}
    .stage-main{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:12px;font-weight:760}
    .stage-meta{margin-top:3px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dot{width:7px;height:7px;border-radius:50%;background:#c8d0d6;flex:0 0 auto}
    .stage.done .dot{background:var(--ok)}
    .stage.active .dot{background:var(--accent)}
    .stage.blocked .dot{background:var(--warn)}
    .content{min-height:0;display:grid;grid-template-columns:232px minmax(420px,1fr) minmax(292px,340px);gap:8px;padding:8px;overflow:hidden}
    .sidebar,.main,.plan-pane{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .sidebar{display:grid;grid-template-rows:auto auto 1fr}
    .main{overflow:auto}
    .plan-pane{display:grid;grid-template-rows:auto 1fr}
    .section-head{display:flex;align-items:center;gap:8px;padding:10px 11px;border-bottom:1px solid var(--line)}
    .section-title{font-size:12px;font-weight:780}
    .section-subtitle{font-size:9px;color:var(--muted);margin-top:2px}
    .count{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}
    .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px;border-bottom:1px solid var(--line)}
    .metric{background:var(--panel-2);border:1px solid #e9edf0;border-radius:7px;padding:7px 8px}
    .metric strong{display:block;font-size:16px;line-height:18px}
    .metric span{font-size:9px;color:var(--muted)}
    .task-list{overflow:auto;padding:5px}
    .task{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:7px;padding:8px 8px;cursor:pointer;margin-bottom:2px}
    .task:hover{background:#f6f9fb}
    .task.active{background:var(--accent-soft);border-color:#c8deef}
    .task-row{display:flex;align-items:center;gap:6px}
    .task-name{font-size:12px;font-weight:780}
    .task-rail{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
    .badge{font-size:9px;border-radius:999px;padding:2px 6px;white-space:nowrap}
    .badge.pending{background:var(--warn-soft);color:var(--warn)}
    .badge.ok{background:var(--ok-soft);color:var(--ok)}
    .badge.info{background:var(--accent-soft);color:var(--accent)}
    .detail{padding:13px}
    .hero{display:flex;gap:11px;align-items:flex-start;padding-bottom:11px;border-bottom:1px solid var(--line)}
    .ref{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace;font-size:22px;font-weight:800;line-height:1}
    .hero-copy{flex:1;min-width:0}
    .hero-title{font-size:13px;font-weight:760}
    .hero-sub{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.55}
    .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}
    .fact{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel-2);min-width:0}
    .fact-label{font-size:9px;color:var(--muted)}
    .fact-value{font-size:11px;font-weight:680;margin-top:2px;word-break:break-word;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .block{margin-top:13px}
    .block-title{font-size:11px;font-weight:780;margin-bottom:6px}
    .note{font-size:10px;line-height:1.55;color:var(--muted);padding:7px 8px;border-left:3px solid #cbd5dc;background:#f7f9fa;border-radius:4px}
    .host-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:7px;margin-top:8px}
    .host{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:10px;text-align:left;min-width:0}
    .host:hover{border-color:#9fc5e1;background:#fbfdff}
    .host.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:#f7fbff}
    .host-top{display:flex;align-items:center;gap:7px;min-width:0}
    .host-ref{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace;font-weight:800;font-size:12px}
    .host-name{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .host-meta{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.45}
    .host-evidence{font-size:9px;color:#7b5a1d;margin-top:6px;padding-top:6px;border-top:1px dashed #eadfc9;line-height:1.45}
    .host-distance{font-size:10px;font-weight:700;color:var(--accent);margin-top:6px}
    .host-actions{display:flex;gap:6px;margin-top:9px}
    .btn.small{padding:5px 8px;font-size:10px;font-weight:700}
    .evidence-line{display:block;margin-top:2px}
    .inline-plan{display:none}
    .plan-scroll{overflow:auto;padding:10px}
    .plan-overview{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:9px}
    .plan-stat{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:8px}
    .plan-stat strong{font-size:16px;display:block}
    .plan-stat span{font-size:9px;color:var(--muted)}
    .constraint-area{margin:0}
    .constraint-summary{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
    .constraint-card{margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
    .constraint-card.ready{border-left:3px solid var(--ok)}
    .constraint-title{font-family:"Cascadia Mono","SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:780}
    .constraint-meta{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.45}
    .blocked{padding:9px;border-radius:8px;background:var(--warn-soft);color:#674611;font-size:10px;line-height:1.55;margin-top:6px}
    details{margin-top:8px}
    summary{cursor:pointer;font-size:10px;color:var(--muted)}
    .diagnostics{font-size:9px;line-height:1.5;color:var(--muted);white-space:pre-wrap;margin-top:6px}
    .empty{height:100%;display:grid;place-items:center;padding:28px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
    .footer{display:flex;align-items:center;gap:7px;padding:9px 11px;background:var(--panel);border-top:1px solid var(--line)}
    .footer-note{font-size:9px;color:var(--muted);margin-left:auto;max-width:360px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .loading{position:absolute;inset:0;background:rgba(244,246,248,.82);display:none;place-items:center;z-index:30}
    .loading.show{display:grid}
    .spinner{width:24px;height:24px;border:3px solid #d8e0e6;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);background:#1f2a33;color:#fff;padding:8px 11px;border-radius:7px;font-size:10px;opacity:0;pointer-events:none;transition:.18s;z-index:50;box-shadow:var(--shadow)}
    .toast.show{opacity:1}
    @media(max-width:1100px){
      .content{grid-template-columns:210px minmax(0,1fr)}
      .plan-pane{display:none}
      .inline-plan{display:block;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
      .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
      .host-grid{grid-template-columns:1fr}
    }
    @media(max-width:720px){
      .statusbar{grid-template-columns:repeat(2,1fr)}
      .content{grid-template-columns:180px minmax(0,1fr)}
      .summary-grid{grid-template-columns:1fr}
      .facts{grid-template-columns:1fr}
      .tag{display:none}
    }
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">LayoutPilot</div>
    <div class="tag">PCB Layout Copilot</div>
    <div class="grow"></div>
    <button class="icon-btn" id="gatewayBtn" title="配置 AI Gateway">⚙</button>
    <button class="icon-btn" id="refreshBtn" title="刷新工作台">↻</button>
  </div>
  <div class="statusbar">
    <div class="stage" id="stageAnalyze">
      <div class="stage-kicker">01 UNDERSTAND</div>
      <div class="stage-main"><span class="dot"></span><span>电路理解</span></div>
      <div class="stage-meta" id="stageAnalyzeMeta">等待分析</div>
    </div>
    <div class="stage" id="stageOwner">
      <div class="stage-kicker">02 CONFIRM</div>
      <div class="stage-main"><span class="dot"></span><span>Owner 确认</span></div>
      <div class="stage-meta" id="stageOwnerMeta">等待证据</div>
    </div>
    <div class="stage" id="stageConstraint">
      <div class="stage-kicker">03 PLAN</div>
      <div class="stage-main"><span class="dot"></span><span>布局约束</span></div>
      <div class="stage-meta" id="stageConstraintMeta">0 条约束</div>
    </div>
    <div class="stage" id="stageExecute">
      <div class="stage-kicker">04 APPLY</div>
      <div class="stage-main"><span class="dot"></span><span>受控执行</span></div>
      <div class="stage-meta" id="stageExecuteMeta">尚未执行</div>
    </div>
  </div>

  <div class="content">
    <aside class="sidebar">
      <div class="section-head">
        <div>
          <div class="section-title">待决器件</div>
          <div class="section-subtitle">待确认优先，已确认项保留用于追溯</div>
        </div>
        <div class="count" id="taskCount">—</div>
      </div>
      <div class="summary-grid">
        <div class="metric"><strong id="metricAnalyzed">—</strong><span>AI 语义</span></div>
        <div class="metric"><strong id="metricPending">—</strong><span>待确认</span></div>
        <div class="metric"><strong id="metricConstraints">—</strong><span>约束</span></div>
      </div>
      <div class="task-list" id="taskList"></div>
    </aside>

    <main class="main" id="mainPanel">
      <div class="empty"><div><strong>正在读取当前 PCB</strong><span>LayoutPilot 会把器件、证据和决策放在同一个工作台里。</span></div></div>
    </main>

    <aside class="plan-pane">
      <div class="section-head">
        <div>
          <div class="section-title">Constraint Plan</div>
          <div class="section-subtitle">由确定性证据 + 人工确认生成</div>
        </div>
      </div>
      <div class="plan-scroll" id="planPanel"></div>
    </aside>
  </div>

  <div class="footer">
    <button class="btn primary" id="analyzeBtn">重新分析</button>
    <button class="btn" id="applyBtn" disabled>应用受控建议</button>
    <button class="btn danger" id="undoBtn" disabled>撤销上次布局</button>
    <div class="footer-note" id="footerNote">执行前仍会进行最终确认、物理重验和 DRC。</div>
  </div>
</div>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>
<script src="/dist/workbench.js"></script>
</body>
</html>
