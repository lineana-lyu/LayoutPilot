<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LayoutPilot · 证据核对</title>
  <style>
    :root{
      color-scheme:light;
      --bg:#f5f6f7;--panel:#fff;--line:#d9dde2;--text:#20252b;
      --muted:#6d7680;--blue:#3f78d3;--blue-soft:#edf3fd;
      --green:#2f8f6b;--danger:#c13d3d;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    body{padding:8px}
    .bar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
    .title{font-size:13px;font-weight:600}
    .meta{margin-top:4px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .evidence{margin-top:5px;font-size:11px;color:#4a5560}
    .actions{display:flex;gap:8px}
    button{height:30px;padding:0 12px;border:1px solid #cfd5dc;border-radius:3px;background:#fff;color:#252b31;font:12px "Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer}
    button:hover{background:#f6f8fa;border-color:#aeb8c2}
    button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    button.primary:hover{background:#3268bd}
    button:disabled{opacity:.45;cursor:not-allowed}
    .status{margin-top:4px;font-size:10px;color:var(--danger)}
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <div class="title" id="title">正在读取证据...</div>
      <div class="meta" id="meta"></div>
      <div class="evidence" id="evidence"></div>
      <div class="status" id="status"></div>
    </div>
    <div class="actions">
      <button id="returnBtn">返回工作台</button>
      <button id="confirmBtn" class="primary">确认 Owner</button>
    </div>
  </div>
  <script src="/dist/evidenceReview.js"></script>
</body>
</html>
